{% extends 'base.html' %}

{% block title %}تأكيد الحذف{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-white rounded-2xl shadow-sm border p-8 text-center">
        <div class="bg-red-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
        </div>
        <h2 class="text-xl font-bold text-gray-900 mb-2">تأكيد حذف الطالب</h2>
        <p class="text-gray-500 mb-6">هل تريد حذف الطالب <strong>"{{ student.name }}"</strong>؟<br>هذا الإجراء لا يمكن التراجع عنه.</p>

        <div class="flex items-center justify-center gap-4">
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-8 py-3 rounded-xl font-bold transition-all">
                    نعم، احذف
                </button>
            </form>
            <a href="{% url 'exams:student_list' %}" class="text-gray-500 hover:text-gray-700 font-bold">إلغاء</a>
        </div>
    </div>
</div>
{% endblock %}
